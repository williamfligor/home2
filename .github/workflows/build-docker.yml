name: Build .Dockerfile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up Docker BuildKit cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          # Config files drive the cached tool-install layer; the repo clone at
          # ~/.config/mise mirrors the post-migration layout (config.toml merged
          # into repo-root mise.toml per decision #10).
          key: buildx-${{ runner.os }}-${{ hashFiles('.Dockerfile', '.dockerignore', 'mise.toml', 'mise.linux.toml', 'mise.macos.toml', 'mise.android.toml', '.miserc.toml') }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Build and test
        run: bash .test.sh
