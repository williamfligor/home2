# ── Runtimes ─────────────────────────────────────────────────
[tools]
go = "latest"
node = "lts"
rust = "latest"
uv = "latest"

# ── Shell & Terminal ────────────────────────────────────────
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
ripgrep = "latest"
tmux = "latest"
yazi = "latest"
zellij = "latest"
"github:neurosnap/zmx" = "latest"

# ── Development ──────────────────────────────────────────────
ast-grep = "latest"
delta = "latest"
difftastic = "latest"
glab = "latest"
gh = "latest"
lazygit = "latest"
neovim = "latest"
yq = "latest"
"antigravity-cli" = "latest"
"github:simeji/jid" = "latest"
"github:tree-sitter/tree-sitter" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"

# ── DevOps & Containers ──────────────────────────────────────
dive = "latest"
lazydocker = "latest"

# ── Documentation & Writing ──────────────────────────────────
pandoc = "latest"
"github:charmbracelet/glow" = "latest"
"github:tldr-pages/tlrc" = "latest"

# ── Network & Diagnostics ────────────────────────────────────
"github:fujiapple852/trippy" = "latest"
"github:ramonvermeulen/whosthere" = "latest"

# ── Zsh plugins ────────────────────────────────────────────

# Commit-hash pinned.
"http:oh-my-zsh" = {
  version = "0.0.1",
  url = "https://github.com/ohmyzsh/ohmyzsh/archive/62afbdebb96bf91c044a92b75d86f85a67da67a7.zip",
  strip_components = 1,
}

"http:zsh-syntax-highlighting" = {
  version = "0.8.0",
  url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/{{ version }}.tar.gz",
  strip_components = 1,
}

"http:zsh-you-should-use" = {
  version = "1.11.1",
  url = "https://github.com/MichaelAquilina/zsh-you-should-use/archive/refs/tags/{{ version }}.tar.gz",
  strip_components = 1,
}

"http:powerlevel10k" = {
  version = "latest",
  url = "https://github.com/romkatv/powerlevel10k/archive/v{{ version }}.tar.gz",
  strip_components = 1,
  version_list_url = "https://api.github.com/repos/romkatv/powerlevel10k/releases/latest",
  version_json_path = ".tag_name",
}

# ── Source-compiled tools ───────────────────────────────────

# Official upstream (GitHub mirror only has up to 1.4f)
"http:autossh" = {
  version = "1.4g",
  url = "https://www.harding.motd.ca/autossh/autossh-{{ version }}.tgz",
  strip_components = 1,
}

# ── macOS .app bundles ─────────────────────────────────────
# Pinned versions + os restriction avoids the .gitignore fallback
# and mise's flaky "latest" resolution from version_list_url.
# postinstall copies the .app into ~/Applications/.
"http:ice" = {
  version = "0.11.12",
  os = ["macos"],
  postinstall = "install-macos-apps http:ice",
  platforms = {
    macos-x64 = { url = "https://github.com/jordanbaird/Ice/releases/download/{{ version }}/Ice.zip" },
    macos-arm64 = { url = "https://github.com/jordanbaird/Ice/releases/download/{{ version }}/Ice.zip" },
  },
}

"http:xbar" = {
  version = "2.1.7-beta",
  os = ["macos"],
  postinstall = "install-macos-apps http:xbar",
  platforms = {
    macos-x64 = { url = "https://github.com/matryer/xbar/releases/download/v{{ version }}/xbar.v{{ version }}.zip" },
    macos-arm64 = { url = "https://github.com/matryer/xbar/releases/download/v{{ version }}/xbar.v{{ version }}.zip" },
  },
}

"http:ghostty" = {
  version = "1.3.1",
  os = ["macos"],
  postinstall = "install-macos-apps http:ghostty",
  platforms = {
    macos-x64 = { url = "https://release.files.ghostty.org/{{ version }}/Ghostty.dmg" },
    macos-arm64 = { url = "https://release.files.ghostty.org/{{ version }}/Ghostty.dmg" },
  },
}

"http:rectangle" = {
  version = "0.96",
  os = ["macos"],
  postinstall = "install-macos-apps http:rectangle",
  platforms = {
    macos-x64 = { url = "https://github.com/rxhanson/Rectangle/releases/download/v{{ version }}/Rectangle{{ version }}.dmg" },
    macos-arm64 = { url = "https://github.com/rxhanson/Rectangle/releases/download/v{{ version }}/Rectangle{{ version }}.dmg" },
  },
}

"http:stats" = {
  version = "3.0.6",
  os = ["macos"],
  postinstall = "install-macos-apps http:stats",
  platforms = {
    macos-x64 = { url = "https://github.com/exelban/stats/releases/download/v{{ version }}/Stats.dmg" },
    macos-arm64 = { url = "https://github.com/exelban/stats/releases/download/v{{ version }}/Stats.dmg" },
  },
}

[settings]
go_set_gobin = true
always_keep_download = true
