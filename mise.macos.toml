# macOS-only configuration — loaded automatically when auto_env is active on
# macOS (`{os}` = macos). See MIGRATION.md decision #3.
#
# Mac .app bundles keep os = ["macos"] (defense-in-depth: if this file is ever
# merged elsewhere the restriction still holds). postinstall runs the
# install-macos-apps mise file-task (config/mise/tasks) via `mise run
# install-macos-apps <app>` — absolute mise path, so it needs no PATH dep, and
# the task env provides uv + mise. Safe ordering: bootstrap applies [dotfiles]
# (step 9) before `mise install` (step 15), so the task file exists.

[tools]
# macOS .app bundles — pinned versions + os restriction avoids the .gitignore
# fallback and mise's flaky "latest" resolution from version_list_url.
"http:ice" = {
  version = "0.11.12",
  os = ["macos"],
  postinstall = "$HOME/.local/bin/mise run install-macos-apps http:ice",
  platforms = {
    macos-x64 = { url = "https://github.com/jordanbaird/Ice/releases/download/{{ version }}/Ice.zip" },
    macos-arm64 = { url = "https://github.com/jordanbaird/Ice/releases/download/{{ version }}/Ice.zip" },
  },
}

"http:xbar" = {
  version = "2.1.7-beta",
  os = ["macos"],
  postinstall = "$HOME/.local/bin/mise run install-macos-apps http:xbar",
  platforms = {
    macos-x64 = { url = "https://github.com/matryer/xbar/releases/download/v{{ version }}/xbar.v{{ version }}.zip" },
    macos-arm64 = { url = "https://github.com/matryer/xbar/releases/download/v{{ version }}/xbar.v{{ version }}.zip" },
  },
}

"http:ghostty" = {
  version = "1.3.1",
  os = ["macos"],
  postinstall = "$HOME/.local/bin/mise run install-macos-apps http:ghostty",
  platforms = {
    macos-x64 = { url = "https://release.files.ghostty.org/{{ version }}/Ghostty.dmg" },
    macos-arm64 = { url = "https://release.files.ghostty.org/{{ version }}/Ghostty.dmg" },
  },
}

"http:rectangle" = {
  version = "0.96",
  os = ["macos"],
  postinstall = "$HOME/.local/bin/mise run install-macos-apps http:rectangle",
  platforms = {
    macos-x64 = { url = "https://github.com/rxhanson/Rectangle/releases/download/v{{ version }}/Rectangle{{ version }}.dmg" },
    macos-arm64 = { url = "https://github.com/rxhanson/Rectangle/releases/download/v{{ version }}/Rectangle{{ version }}.dmg" },
  },
}

"http:stats" = {
  version = "3.0.6",
  os = ["macos"],
  postinstall = "$HOME/.local/bin/mise run install-macos-apps http:stats",
  platforms = {
    macos-x64 = { url = "https://github.com/exelban/stats/releases/download/v{{ version }}/Stats.dmg" },
    macos-arm64 = { url = "https://github.com/exelban/stats/releases/download/v{{ version }}/Stats.dmg" },
  },
}

# ── macOS-only dotfiles ──────────────────────────────────────────────────────
# File-level symlinks. xbar plugins must stay executable (+x from git).
[dotfiles]
"~/Library/KeyBindings" = { source = "Library/KeyBindings", mode = "symlink" }
"~/Library/Application Support/xbar/plugins" = { source = "Library/Application Support/xbar/plugins", mode = "symlink-each" }