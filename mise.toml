# ─────────────────────────────────────────────────────────────────────────────
# Global mise configuration for williamfligor/home2 (chezmoi → mise bootstrap).
#
# With `mise bootstrap --from-git williamfligor/home2 --yes`, this repo is cloned
# into $MISE_CONFIG_DIR (~/.config/mise) and THIS file becomes the global config.
# Relative [dotfiles] sources resolve against this file's directory (the clone),
# so the same repo works identically on any machine.
#
# Layout:
#   mise.toml          shared: [tools], [settings], [dotfiles], [tasks.bootstrap], [bootstrap.*]
#   mise.macos.toml    macOS-only (auto_env): mac .app bundles, ~/Library dotfiles
#   mise.linux.toml    Linux-only (auto_env) — currently empty placeholder
#   mise.android.toml  Termux-only — requires explicit MISE_ENV=android (mise has no
#                      android platform env; docs list only linux/macos/windows)
#   .miserc.toml       early-init: auto_env
#   install.sh         curl mise + clone into ~/.config/mise + mise bootstrap --yes
#
# See MIGRATION.md for the full migration plan and verification log.
# ─────────────────────────────────────────────────────────────────────────────

# Validated on 2026.9.1 in the Docker smoke test: `mise bootstrap` + `bootstrap dotfiles`
# subcommands present; MISE_AUTO_ENV works. Do not lower.
min_version = "2026.9.1"

[settings]
go_set_gobin = true
always_keep_download = true
# Symlink dotfiles by default (file-level only; never whole stateful dirs).
dotfiles.default_mode = "symlink"

# ── Tools (shared across macOS / Linux / Termux) ─────────────────────────────
[tools]
# Runtimes
go = "latest"
node = "lts"
rust = "latest"
uv = "latest"

# Shell & terminal
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
ripgrep = "latest"
tmux = "latest"
yazi = "latest"
zellij = "latest"
"github:neurosnap/zmx" = "latest"

# Development
ast-grep = "latest"
delta = "latest"
difftastic = "latest"
glab = "latest"
gh = "latest"
lazygit = "latest"
neovim = "latest"
yq = "latest"
"antigravity-cli" = "latest"
"github:simeji/jid" = "latest"
"github:tree-sitter/tree-sitter" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@tobilu/qmd" = { version = "latest", npm_args = "--ignore-scripts=false" }

# DevOps & containers
dive = "latest"
lazydocker = "latest"

# Sandboxing
# Pinned deliberately until nono hits 1.0: tool-sandbox/network behaviour
# changes between releases (v0.71: allow_all IPC crash, CONNECT 443-only).
"github:nolabs-ai/nono" = "0.71.0"

# Documentation & writing
pandoc = "latest"
"github:charmbracelet/glow" = "latest"
"github:tldr-pages/tlrc" = "latest"

# Network & diagnostics
"github:fujiapple852/trippy" = "latest"
"github:ramonvermeulen/whosthere" = "latest"

# Zsh plugins (commit-hash pinned oh-my-zsh; tag-following rest)
"http:oh-my-zsh" = {
  version = "0.0.1",
  url = "https://github.com/ohmyzsh/ohmyzsh/archive/62afbdebb96bf91c044a92b75d86f85a67da67a7.zip",
  strip_components = 1,
}

"http:zsh-syntax-highlighting" = {
  version = "0.8.0",
  url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/{{ version }}.tar.gz",
  strip_components = 1,
}

"http:zsh-you-should-use" = {
  version = "1.11.1",
  url = "https://github.com/MichaelAquilina/zsh-you-should-use/archive/refs/tags/{{ version }}.tar.gz",
  strip_components = 1,
}

"http:powerlevel10k" = {
  version = "latest",
  url = "https://github.com/romkatv/powerlevel10k/archive/v{{ version }}.tar.gz",
  strip_components = 1,
  version_list_url = "https://api.github.com/repos/romkatv/powerlevel10k/releases/latest",
  version_json_path = ".tag_name",
}

# Source-compiled tools
# Official upstream (GitHub mirror only has up to 1.4f)
"http:autossh" = {
  version = "1.4g",
  url = "https://www.harding.motd.ca/autossh/autossh-{{ version }}.tgz",
  strip_components = 1,
}

# ── Dotfiles (shared; file-level symlinks only) ──────────────────────────────
# Sources are relative to this file's directory (the clone), per the docs:
# "Relative explicit sources resolve against the directory of the config file
# that declares the entry."
# Runtime state trees (~/.config/nvim writes lazy-lock.json; ~/.pi writes
# sqlite/node_modules; ~/.ssh/sockets) are never declared/linked.
[dotfiles]
# Shell
"~/.zshrc" = { source = "zshrc", mode = "symlink" }
"~/.zshenv" = { source = "zshenv", mode = "symlink" }
"~/.gitconfig" = { source = "gitconfig", mode = "symlink" }
"~/.dircolors" = { source = "dircolors", mode = "symlink" }
"~/.p10k.zsh" = { source = "p10k.zsh", mode = "symlink" }
"~/.tmux.conf" = { source = "tmux.conf", mode = "symlink" }
"~/.config/zsh/aliases.sh" = { source = "config/zsh/aliases.sh", mode = "symlink" }
"~/.config/zsh/functions.sh" = { source = "config/zsh/functions.sh", mode = "symlink" }
"~/.config/zsh/env.sh" = { source = "config/zsh/env.sh", mode = "symlink" }
"~/.zshrc.d/10-mise-plugin.zsh" = { source = "zshrc.d/10-mise-plugin.zsh", mode = "symlink" }
"~/.zshrc.d/50-nono.zsh" = { source = "zshrc.d/50-nono.zsh", mode = "symlink" }
"~/.zshrc.d/90-history-backup.zsh" = { source = "zshrc.d/90-history-backup.zsh", mode = "symlink" }

# Shared app config
"~/.config/bat/config" = { source = "config/bat/config", mode = "symlink" }
"~/.config/bottom/bottom.toml" = { source = "config/bottom/bottom.toml", mode = "symlink" }
"~/.config/ghostty/config" = { source = "config/ghostty/config", mode = "symlink" }
"~/.config/git/ignore" = { source = "config/git/ignore", mode = "symlink" }
"~/.config/nono/profiles/pi.json" = { source = "config/nono/profiles/pi.json", mode = "symlink" }
"~/.config/yazi/init.lua" = { source = "config/yazi/init.lua", mode = "symlink" }
"~/.config/yazi/keymap.toml" = { source = "config/yazi/keymap.toml", mode = "symlink" }
"~/.config/yazi/plugins/confirm-quit.yazi/main.lua" = { source = "config/yazi/plugins/confirm-quit.yazi/main.lua", mode = "symlink" }
"~/.config/yazi/plugins/folder-rules.yazi/main.lua" = { source = "config/yazi/plugins/folder-rules.yazi/main.lua", mode = "symlink" }
"~/.config/yazi/plugins/smart-tab.yazi/main.lua" = { source = "config/yazi/plugins/smart-tab.yazi/main.lua", mode = "symlink" }
"~/.config/zellij/config.kdl" = { source = "config/zellij/config.kdl", mode = "symlink" }

# Neovim (file-level: nvim writes lazy-lock.json next to these)
"~/.config/nvim/init.lua" = { source = "config/nvim/init.lua", mode = "symlink" }
"~/.config/nvim/lua/config/autocmds.lua" = { source = "config/nvim/lua/config/autocmds.lua", mode = "symlink" }
"~/.config/nvim/lua/config/keymaps.lua" = { source = "config/nvim/lua/config/keymaps.lua", mode = "symlink" }
"~/.config/nvim/lua/config/lazy.lua" = { source = "config/nvim/lua/config/lazy.lua", mode = "symlink" }
"~/.config/nvim/lua/config/options.lua" = { source = "config/nvim/lua/config/options.lua", mode = "symlink" }
"~/.config/nvim/lua/plugins/init.lua" = { source = "config/nvim/lua/plugins/init.lua", mode = "symlink" }

# ~/.local/bin — one symlink per executable (keeps each file's +x)
"~/.local/bin" = { source = "local/bin", mode = "symlink-each" }

# SSH — config file only; keys stay per-machine, sockets/ is runtime state
"~/.ssh/config" = { source = "ssh/config", mode = "symlink" }

# Mise global tasks (task files; discovered from ~/.config/mise/tasks)
"~/.config/mise/tasks/update-pi" = { source = "config/mise/tasks/update-pi", mode = "symlink" }
"~/.config/mise/tasks/update-pi-summary" = { source = "config/mise/tasks/update-pi-summary", mode = "symlink" }

# Pi agent files — file-level only. ~/.pi/agent/{auth.json,sessions,git,tmp,npm,
# pi-web.sqlite,extensions/*/node_modules} are runtime state and stay unmanaged.
"~/.pi/agent/agents/researcher.md" = { source = "pi/agent/agents/researcher.md", mode = "symlink" }
"~/.pi/agent/extensions/answer.ts" = { source = "pi/agent/extensions/answer.ts", mode = "symlink" }
"~/.pi/agent/extensions/matplotlib-agg.ts" = { source = "pi/agent/extensions/matplotlib-agg.ts", mode = "symlink" }
"~/.pi/agent/extensions/notify.ts" = { source = "pi/agent/extensions/notify.ts", mode = "symlink" }
"~/.pi/agent/extensions/pi-tool-display/config.json" = { source = "pi/agent/extensions/pi-tool-display/config.json", mode = "symlink" }
"~/.pi/agent/extensions/review.ts" = { source = "pi/agent/extensions/review.ts", mode = "symlink" }
"~/.pi/agent/extensions/sandbox.json" = { source = "pi/agent/extensions/sandbox.json", mode = "symlink" }
"~/.pi/agent/extensions/slash-guard.ts" = { source = "pi/agent/extensions/slash-guard.ts", mode = "symlink" }
"~/.pi/agent/extensions/sort-packages.ts" = { source = "pi/agent/extensions/sort-packages.ts", mode = "symlink" }
"~/.pi/agent/extensions/tools.ts" = { source = "pi/agent/extensions/tools.ts", mode = "symlink" }
"~/.pi/agent/extensions/uv.ts" = { source = "pi/agent/extensions/uv.ts", mode = "symlink" }
"~/.pi/agent/extensions/web-gate.ts" = { source = "pi/agent/extensions/web-gate.ts", mode = "symlink" }
"~/.pi/agent/extensions/web-search.ts" = { source = "pi/agent/extensions/web-search.ts", mode = "symlink" }
"~/.pi/agent/extensions/whimsical.ts" = { source = "pi/agent/extensions/whimsical.ts", mode = "symlink" }
"~/.pi/agent/models.json" = { source = "pi/agent/models.json", mode = "symlink" }
"~/.pi/agent/pi-vcc-config.json" = { source = "pi/agent/pi-vcc-config.json", mode = "symlink" }
"~/.pi/agent/prompts/brainstorm.md" = { source = "pi/agent/prompts/brainstorm.md", mode = "symlink" }
"~/.pi/agent/prompts/execute-plan.md" = { source = "pi/agent/prompts/execute-plan.md", mode = "symlink" }
"~/.pi/agent/prompts/implement-and-review.md" = { source = "pi/agent/prompts/implement-and-review.md", mode = "symlink" }
"~/.pi/agent/prompts/implement.md" = { source = "pi/agent/prompts/implement.md", mode = "symlink" }
"~/.pi/agent/prompts/scout-and-plan.md" = { source = "pi/agent/prompts/scout-and-plan.md", mode = "symlink" }
"~/.pi/agent/settings.json" = { source = "pi/agent/settings.json", mode = "symlink" }
"~/.pi/agent/skills/review-git-status-diff/SKILL.md" = { source = "pi/agent/skills/review-git-status-diff/SKILL.md", mode = "symlink" }
"~/.pi/agent/skills/uv-package-manager/README.md" = { source = "pi/agent/skills/uv-package-manager/README.md", mode = "symlink" }
"~/.pi/agent/skills/uv-package-manager/references/advanced-patterns.md" = { source = "pi/agent/skills/uv-package-manager/references/advanced-patterns.md", mode = "symlink" }
"~/.pi/agent/skills/uv-package-manager/SKILL.md" = { source = "pi/agent/skills/uv-package-manager/SKILL.md", mode = "symlink" }
"~/.pi/agent/skills/uv-package-manager/uv-package-manager/.keep" = { source = "pi/agent/skills/uv-package-manager/uv-package-manager/.keep", mode = "symlink" }
"~/.pi/agent/skills/video-to-recipe/scripts/download.py" = { source = "pi/agent/skills/video-to-recipe/scripts/download.py", mode = "symlink" }
"~/.pi/agent/skills/video-to-recipe/scripts/ocr-extraction.py" = { source = "pi/agent/skills/video-to-recipe/scripts/ocr-extraction.py", mode = "symlink" }
"~/.pi/agent/skills/video-to-recipe/scripts/transcribe.py" = { source = "pi/agent/skills/video-to-recipe/scripts/transcribe.py", mode = "symlink" }
"~/.pi/agent/skills/video-to-recipe/SKILL.md" = { source = "pi/agent/skills/video-to-recipe/SKILL.md", mode = "symlink" }

# ── Bootstrap (final task, hooks, skill repos) ───────────────────────────────
# The bootstrap final task runs on every `mise bootstrap` — each script is
# idempotent (key exists / mtime guard / sha marker). `{{ config_root }}` is the
# clone dir (global config root), available in task/hook templates.

[tasks.bootstrap]
# run commands are executed via sh; `~` tilde-expands there. The scripts are
# symlinked into ~/.local/bin by [dotfiles] (symlink-each of local/bin),
# which applies before the final task. {{ config_root }} templating is not
# available in 2026.9.1 (verified), hence the HOME-relative paths.
run = [
  "~/.local/bin/bootstrap-ssh-key",
  "~/.local/bin/build-autossh",
  "~/.local/bin/fetch-grill-me",
]

# Whole-repo skills (bootstrap.repos cannot strip subdirectories). Pinned to the
# exact commits the old .chezmoiexternal.toml used (decision #4).
[bootstrap.repos]
"~/.agents/skills/avoid-ai-writing" = {
  url = "https://github.com/conorbronsdon/avoid-ai-writing.git",
  ref = "efc19575bab315e9bcc5f33d0435040c1a6022cd",
}
"~/.agents/skills/humanizer" = {
  url = "https://github.com/blader/humanizer.git",
  ref = "523374dee72d67c7b2b5f858ea0094ffda49c3ac",
}

# npm install for pi extensions — runs after `mise install` (tools present).
[bootstrap.hooks.post-tools]
run = "~/.local/bin/pi-ext-deps"