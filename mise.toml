# ─────────────────────────────────────────────────────────────────────────────
# Global mise configuration for williamfligor/home2 (chezmoi → mise bootstrap).
#
# With `mise bootstrap --from-git williamfligor/home2 --yes`, this repo is cloned
# into $MISE_CONFIG_DIR (~/.config/mise) and THIS file becomes the global config.
# Relative [dotfiles] sources resolve against this file's directory (the clone),
# so the same repo works identically on any machine.
#
# Layout:
#   mise.toml          shared: [tools], [settings], [dotfiles], [tasks.bootstrap], [bootstrap.*]
#   mise.macos.toml    macOS-only (auto_env): mac .app bundles, ~/Library dotfiles
#   mise.linux.toml    Linux-only (auto_env) — currently empty placeholder
#   mise.android.toml  Termux-only — requires explicit MISE_ENV=android (mise has no
#                      android platform env; docs list only linux/macos/windows)
#   .miserc.toml       early-init: auto_env
#   install.sh         curl mise + clone into ~/.config/mise + mise bootstrap --yes
#
# See MIGRATION.md for the full migration plan and verification log.
# ─────────────────────────────────────────────────────────────────────────────

# Validated on 2026.9.1 in the Docker smoke test: `mise bootstrap` + `bootstrap dotfiles`
# subcommands present; MISE_AUTO_ENV works. Do not lower.
min_version = "2026.9.1"

[settings]
go_set_gobin = true
always_keep_download = true
# Symlink dotfiles by default (file-level only; never whole stateful dirs).
dotfiles.default_mode = "symlink"

# ── Tools (shared across macOS / Linux / Termux) ─────────────────────────────
[tools]
# Runtimes
go = "latest"
node = "lts"
rust = "latest"
uv = "latest"

# Shell & terminal
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
ripgrep = "latest"
tmux = "latest"
yazi = "latest"
zellij = "latest"
"github:neurosnap/zmx" = "latest"

# Development
ast-grep = "latest"
delta = "latest"
difftastic = "latest"
glab = "latest"
gh = "latest"
lazygit = "latest"
neovim = "latest"
yq = "latest"
"antigravity-cli" = "latest"
"github:simeji/jid" = "latest"
"github:tree-sitter/tree-sitter" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@tobilu/qmd" = { version = "latest", npm_args = "--ignore-scripts=false" }

# DevOps & containers
dive = "latest"
lazydocker = "latest"

# Sandboxing
# Pinned deliberately until nono hits 1.0: tool-sandbox/network behaviour
# changes between releases (v0.71: allow_all IPC crash, CONNECT 443-only).
"github:nolabs-ai/nono" = "0.71.0"

# Documentation & writing
pandoc = "latest"
"github:charmbracelet/glow" = "latest"
"github:tldr-pages/tlrc" = "latest"

# Network & diagnostics
"github:fujiapple852/trippy" = "latest"
"github:ramonvermeulen/whosthere" = "latest"

# Zsh plugins (commit-hash pinned oh-my-zsh; tag-following rest)
"http:oh-my-zsh" = {
  version = "0.0.1",
  url = "https://github.com/ohmyzsh/ohmyzsh/archive/62afbdebb96bf91c044a92b75d86f85a67da67a7.zip",
  strip_components = 1,
}

"http:zsh-syntax-highlighting" = {
  version = "0.8.0",
  url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/{{ version }}.tar.gz",
  strip_components = 1,
}

"http:zsh-you-should-use" = {
  version = "1.11.1",
  url = "https://github.com/MichaelAquilina/zsh-you-should-use/archive/refs/tags/{{ version }}.tar.gz",
  strip_components = 1,
}

"http:powerlevel10k" = {
  version = "latest",
  url = "https://github.com/romkatv/powerlevel10k/archive/v{{ version }}.tar.gz",
  strip_components = 1,
  version_list_url = "https://api.github.com/repos/romkatv/powerlevel10k/releases/latest",
  version_json_path = ".tag_name",
}

# Source-compiled tools
# Official upstream (GitHub mirror only has up to 1.4f)
"http:autossh" = {
  version = "1.4g",
  url = "https://www.harding.motd.ca/autossh/autossh-{{ version }}.tgz",
  strip_components = 1,
}

# ── Dotfiles (shared; file-level symlinks only) ──────────────────────────────
# Sources are relative to this file's directory (the clone), per the docs:
# "Relative explicit sources resolve against the directory of the config file
# that declares the entry."
# Runtime state trees (~/.config/nvim writes lazy-lock.json; ~/.pi writes
# sqlite/node_modules; ~/.ssh/sockets) are never declared/linked.
[dotfiles]
# ── $HOME-root dotfiles (no directory to link) ───────────────────────────────
"~/.zshrc" = { source = "zshrc", mode = "symlink" }
"~/.zshenv" = { source = "zshenv", mode = "symlink" }
"~/.gitconfig" = { source = "gitconfig", mode = "symlink" }
"~/.dircolors" = { source = "dircolors", mode = "symlink" }
"~/.p10k.zsh" = { source = "p10k.zsh", mode = "symlink" }
"~/.tmux.conf" = { source = "tmux.conf", mode = "symlink" }

# ── Fully-owned, static dirs → whole-folder symlink (one link; nothing else
#    lives in the target, nothing writes there at runtime) ───────────────────
"~/.config/zsh" = { source = "config/zsh", mode = "symlink" }
"~/.zshrc.d" = { source = "zshrc.d", mode = "symlink" }
"~/.config/bat" = { source = "config/bat", mode = "symlink" }
"~/.config/bottom" = { source = "config/bottom", mode = "symlink" }
"~/.config/ghostty" = { source = "config/ghostty", mode = "symlink" }
"~/.config/git" = { source = "config/git", mode = "symlink" }
"~/.config/zellij" = { source = "config/zellij", mode = "symlink" }
"~/.config/yazi" = { source = "config/yazi", mode = "symlink" }
"~/.config/mise/tasks" = { source = "config/mise/tasks", mode = "symlink" }

# ── Dirs with unmanaged neighbors / runtime writes → symlink-each (links the
#    individual files, preserves what we don't own):
#    ~/.config/nvim writes lazy-lock.json + lazy/; ~/.pi/agent holds auth.json,
#    sessions/, git/, tmp/, npm/, *.sqlite; ~/.config/nono/profiles gains
#    profiles at runtime (`nono profile promote`); ~/.local/bin gains non-repo
#    tools (e.g. autossh). ────────────────────────────────────────────────────
"~/.config/nvim" = { source = "config/nvim", mode = "symlink-each" }
"~/.config/nono/profiles" = { source = "config/nono/profiles", mode = "symlink-each" }
"~/.pi/agent" = { source = "pi/agent", mode = "symlink-each" }
"~/.local/bin" = { source = "local/bin", mode = "symlink-each" }

# ── Single file inside a private/shared dir ─────────────────────────────────
"~/.ssh/config" = { source = "ssh/config", mode = "symlink" }
# ── Bootstrap (final task, hooks, skill repos) ───────────────────────────────
# The bootstrap final task runs on every `mise bootstrap` — each script is
# idempotent (key exists / mtime guard / sha marker). `{{ config_root }}` is the
# clone dir (global config root), available in task/hook templates.

[tasks.bootstrap]
# Runs the machine-setup tasks below as prerequisites. They are mise file-tasks
# in config/mise/tasks/ (symlinked to ~/.config/mise/tasks by [dotfiles], which
# applies before the final task, so the files exist when deps are resolved).
# Each is idempotent (key exists / mtime guard / sha marker). {{ config_root }}
# templating is not available in 2026.9.1 (verified), so the tasks use
# HOME-relative paths.
depends = ["bootstrap-ssh-key", "build-autossh", "fetch-grill-me"]

# Whole-repo skills (bootstrap.repos cannot strip subdirectories). Pinned to the
# exact commits the old .chezmoiexternal.toml used (decision #4).
[bootstrap.repos]
"~/.agents/skills/avoid-ai-writing" = {
  url = "https://github.com/conorbronsdon/avoid-ai-writing.git",
  ref = "efc19575bab315e9bcc5f33d0435040c1a6022cd",
}
"~/.agents/skills/humanizer" = {
  url = "https://github.com/blader/humanizer.git",
  ref = "523374dee72d67c7b2b5f858ea0094ffda49c3ac",
}

# npm install for pi extensions — runs after `mise install` (tools present).
[bootstrap.hooks.post-tools]
run = "~/.local/bin/pi-ext-deps"